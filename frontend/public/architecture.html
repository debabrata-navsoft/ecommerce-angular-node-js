
<!DOCTYPE html>
<html>
<head>
<style>

  :root {
  --font-sans: Arial, sans-serif;

  --color-text-primary: #111827;
  --color-text-secondary: #6b7280;

  --color-border-secondary: #d1d5db;

  --color-bg: #ffffff;

  --purple: #7c3aed;
  --teal: #14b8a6;
  --coral: #f97316;
  --amber: #f59e0b;
  --blue: #3b82f6;
  --green: #22c55e;
  --gray: #6b7280;
}

/* SVG theme classes */
.c-purple rect { fill: #f3e8ff; stroke: var(--purple); }
.c-teal rect { fill: #ccfbf1; stroke: var(--teal); }
.c-coral rect { fill: #ffedd5; stroke: var(--coral); }
.c-amber rect { fill: #fef3c7; stroke: var(--amber); }
.c-blue rect { fill: #dbeafe; stroke: var(--blue); }
.c-green rect { fill: #dcfce7; stroke: var(--green); }
.c-gray rect { fill: #f3f4f6; stroke: var(--gray); }

.th {
  font-size: 14px;
  font-weight: 700;
  fill: #111827;
}

.ts {
  font-size: 11px;
  fill: #374151;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans, sans-serif); background: transparent; color: var(--color-text-primary); }
.wrap { padding: 16px 0; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1.5px solid var(--color-border-secondary); color: var(--color-text-secondary); background: transparent; transition: all .15s; }
.tab.active { border-color: #534AB7; color: #534AB7; background: #EEEDFE; }
.panel { display: none; }
.panel.active { display: block; }
svg text { font-family: var(--font-sans, sans-serif); }


/* Responsive container */
.wrap {
  padding: 16px;
  width: 100%;
  overflow-x: auto;
}

/* Better SVG responsive */
svg {
  width: 100%;
  height: auto;
  display: block;
}

/* Better text rendering */
svg text {
  font-family: var(--font-sans, sans-serif);
  word-spacing: 1px;
}

/* Main title text */
.th {
  font-size: 13px;
  font-weight: 700;
  fill: #111827;
}

/* Small description text */
.ts {
  font-size: 10px;
  fill: #374151;
}

/* Improve node hover */
.node rect {
  transition: all 0.2s ease;
}

.node:hover rect {
  transform: translateY(-2px);
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.12));
}

/* Mobile responsive */
@media (max-width: 768px) {
  .tabs {
    gap: 10px;
    justify-content: center;
  }

  .tab {
    font-size: 11px;
    padding: 8px 12px;
  }

  .th {
    font-size: 11px;
  }

  .ts {
    font-size: 8px;
  }

  svg {
    min-width: 900px;
  }
}

/* Prevent text overflow */
text {
  overflow: hidden;
}

/* Smooth UI */
.panel {
  animation: fade .25s ease;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<script>
function show(tab) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  event.target.classList.add('active');
}
